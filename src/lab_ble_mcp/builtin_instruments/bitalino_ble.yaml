# BiTalino (r)evolution (BLE) — named commands for the streaming backend.
#
# Command strings are this backend's wire language, not SCPI. Byte-level framing
# lives in bitalino_frame.py; the streaming transport and GATT UUIDs live in
# profiles/bitalino_ble.yaml. Every command here is a query: ACQUIRE returns a
# reference to a captured artifact, and its only writes are the board's own
# bounded start/stop control bytes, which no command names.
metadata:
  manufacturer: "PLUX"
  model: "BiTalino (r)evolution (BLE)"
  category: "biosignal_acquisition"
  description: >-
    Six-channel biosignal acquisition board over Bluetooth Low Energy. Channels
    A1..A6 stream raw ADC counts (A1..A4 are 10-bit, A5..A6 are 6-bit); the
    physical meaning depends on the sensor wired to each port. ACQUIRE captures a
    finite burst to an artifact.
  manual_ref: "PLUX BiTalino (r)evolution BLE block datasheet"
  support_level: "tested"
  tested_interfaces: ["BLE"]
  tested_firmware: ""
  definition_version: "0.2.0"
  validation_evidence:
    tested_by: "TECTOS"
    tested_at: "2026-07-24"
    interface: "BLE"
    firmware: ""
    tested_items:
      - identify
      - acquire_1s_at_100hz
      - acquire_10s_at_100hz
      - acquire_1s_at_1000hz
    notes: >-
      Acquired from unit 88:6B:0F:8B:95:69 over GATT notifications at 100 Hz (100
      and 1000 samples) and at 1000 Hz (1000 samples), plus three back-to-back
      captures. Every frame passed CRC-4 and the sequence counter ran without a
      gap (dropped_frames = 0) in all of them, confirming this block streams the
      same frame format as the BT block. Reading the unit's GATT table showed the
      commands characteristic supports "write" (with response) but not
      write-without-response; unacknowledged writes left the board idle and
      yielded zero frames. Sensor-connected channels and the 1 Hz and 10 Hz rates
      were not exercised, so this is "tested" rather than "verified".

connection:
  # ACQUIRE derives its own deadline from samples / rate; this nominal default is
  # only a ceiling for short captures and clears the ecosystem's cold-BLE guard.
  default_timeout_ms: 30000
  read_termination: ""
  write_termination: ""

commands:
  identify:
    scpi: "INFO model"
    type: "query"
    description: "Return the model name declared by the bound profile."
    returns:
      type: "string"

  acquire_1s_at_100hz:
    scpi: "ACQUIRE 100 @100"
    type: "query"
    description: "Capture 100 samples at 100 Hz (1 s) to an artifact."
    returns:
      type: "string"

  acquire_10s_at_100hz:
    scpi: "ACQUIRE 1000 @100"
    type: "query"
    description: "Capture 1000 samples at 100 Hz (10 s) to an artifact."
    returns:
      type: "string"

  acquire_1s_at_1000hz:
    scpi: "ACQUIRE 1000 @1000"
    type: "query"
    description: "Capture 1000 samples at 1000 Hz (1 s) to an artifact."
    returns:
      type: "string"

# No instantaneous state: the board reports nothing until an acquisition is
# running, so there is no single value to poll here.
state_query: {}

# Intentionally empty. ACQUIRE already returns the board to idle with a stop byte
# when it finishes, so nothing persists that would need to be made safe, and the
# command grammar exposes no write a sequence could leave in an unsafe state.
safe_shutdown: []
